name: Sync upstream

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: QuantumNous/new-api

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream main

      - name: Merge upstream/main
        id: sync
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"
          if ! git merge --no-ff --no-commit upstream/main; then
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rm -rq --ignore-unmatch .github || true
          git checkout HEAD -- .github || true
          git commit -m "Merge upstream/main (keep local .github)"
          echo "status=merged" >> "$GITHUB_OUTPUT"

      - name: Push merge commit
        if: steps.sync.outputs.status == 'merged'
        run: git push origin HEAD:main

      - name: Report conflict
        if: steps.sync.outputs.status == 'conflict'
        run: |
          echo "::error::upstream/main conflicts with main. Locally: git fetch upstream && git merge upstream/main, resolve, then push. Conflicts are listed in the job log above."
          exit 1
