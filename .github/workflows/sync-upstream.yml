name: Sync upstream

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch --no-tags upstream main

      - name: Merge upstream/main
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"
          if ! git merge --no-edit upstream/main; then
            echo "::error::Merge conflict with upstream/main; resolve locally."
            git merge --abort
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main
