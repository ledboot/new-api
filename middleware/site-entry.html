<!doctype html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <style nonce="{{.Nonce}}">
    :root {
      color-scheme: light;
      color: #313131;
      background: #fff;
      font-family: system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
    }
    main, footer {
      width: min(56rem, calc(100% - 3rem));
      margin-inline: auto;
    }
    main {
      flex: 1;
      padding-block: clamp(3.5rem, 7vw, 8rem) 3rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.5rem);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    h2 { margin: .5rem 0; font-size: clamp(1.25rem, 3vw, 1.5rem); }
    p { margin: 0; line-height: 1.5; }
    .verification { margin-top: 2rem; }
    #challenge { max-width: 25rem; }
    #progress {
      width: 1.25rem;
      height: 1.25rem;
      border: .25rem solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #progress { animation: none; }
    }
    button {
      margin-top: .75rem;
      padding: .45rem .75rem;
      font: inherit;
      cursor: pointer;
    }
    footer {
      border-top: 1px solid #dedede;
      padding-block: 1rem;
      font-size: .75rem;
      text-align: center;
    }
    footer a { color: #2453b3; }
    .separator { padding-inline: .35rem; }
  </style>
</head>
<body>
  <main>
    <h1>{{.Hostname}}</h1>
    <h2>{{.Title}}</h2>
    <p>{{.Description}}</p>
    <div class="verification">
      <div id="progress" aria-hidden="true" hidden></div>
      <div id="challenge" data-sitekey="{{.SiteKey}}" data-action="{{.Action}}"></div>
      <div id="failure" hidden>
        <p role="alert">{{.Error}}</p>
        <button type="button" id="retry">{{.Retry}}</button>
      </div>
      <noscript>{{.NoScript}}</noscript>
    </div>
  </main>
  <footer>
    {{if .RayID}}<p>Ray ID: {{.RayID}}</p>{{end}}
    <p>
      <a href="https://www.cloudflare.com/products/turnstile/">{{.Provider}}</a>
      <span class="separator" aria-hidden="true">|</span>
      <a href="https://www.cloudflare.com/privacypolicy/">{{.Privacy}}</a>
    </p>
  </footer>
  <script nonce="{{.Nonce}}">
    const challenge = document.getElementById('challenge')
    const failure = document.getElementById('failure')
    const progress = document.getElementById('progress')
    progress.hidden = false

    function showFailure() {
      progress.hidden = true
      challenge.hidden = true
      failure.hidden = false
    }

    document.getElementById('retry').onclick = () => window.location.reload()

    window.renderSiteEntry = () => {
      try {
        window.turnstile.render(challenge, {
          sitekey: challenge.dataset.sitekey,
          action: challenge.dataset.action,
          size: 'flexible',
          theme: 'light',
          appearance: 'interaction-only',
          'before-interactive-callback': () => { progress.hidden = true },
          'after-interactive-callback': () => { progress.hidden = !failure.hidden },
          'unsupported-callback': showFailure,
          retry: 'never',
          'error-callback': showFailure,
          'expired-callback': showFailure,
          'timeout-callback': showFailure,
          callback: async (token) => {
            try {
              const response = await fetch('/api/site-entry/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token }),
                signal: AbortSignal.timeout(15000),
              })
              if (response.status !== 204) {
                showFailure()
                return
              }
              window.location.reload()
            } catch {
              showFailure()
            }
          },
        })
      } catch {
        showFailure()
      }
    }

    const script = document.createElement('script')
    script.nonce = document.currentScript.nonce
    script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=renderSiteEntry&render=explicit'
    script.onerror = showFailure
    document.head.appendChild(script)
  </script>
</body>
</html>
